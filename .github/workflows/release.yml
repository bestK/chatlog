name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    build-windows:
        name: Build Windows
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      web/pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Install Wails
              run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

            - name: Build
              run: |
                  pnpm --dir web install --frozen-lockfile
                  pnpm --dir web run build
                  pnpm --dir frontend install --frozen-lockfile
                  pnpm --dir frontend run build
                  wails build -clean -s

            - name: Package
              shell: bash
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  7z a chatlog_${VERSION}_windows_amd64.zip ./build/bin/chatlog.exe

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: chatlog-windows-amd64
                  path: chatlog_*.zip

    build-macos:
        name: Build macOS arm64
        runs-on: macos-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      web/pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Install Wails
              run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

            - name: Build
              run: |
                  pnpm --dir web install --frozen-lockfile
                  pnpm --dir web run build
                  pnpm --dir frontend install --frozen-lockfile
                  pnpm --dir frontend run build
                  wails build -clean -s

            - name: Package
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  cd build/bin && zip -j ../../chatlog_${VERSION}_darwin_arm64.zip chatlog

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: darwin-arm64
                  path: chatlog_*.zip

    release:
        name: Create Release
        needs: [build-windows, build-macos]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true

            - name: Generate checksums
              run: sha256sum chatlog_*.zip > checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  draft: false
                  generate_release_notes: true
                  files: |
                      chatlog_*.zip
                      checksums.txt
