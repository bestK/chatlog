name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        name: Release Binary
        runs-on: ubuntu-latest
        container:
            image: goreleaser/goreleaser-cross:v1.25.8
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fix git permissions
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install UPX
              uses: crazy-max/ghaction-upx@v3
              with:
                  install-only: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      web/pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Run GoReleaser
              run: goreleaser release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
