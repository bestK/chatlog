name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    build-windows:
        name: Build Windows
        runs-on: ubuntu-latest
        container:
            image: goreleaser/goreleaser-cross:v1.25.8
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fix git permissions
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install tools
              run: apt-get update && apt-get install -y zip

            - name: Install UPX
              uses: crazy-max/ghaction-upx@v3
              with:
                  install-only: true

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: /root/go/pkg/mod
                  key: go-mod-${{ hashFiles('go.sum') }}
                  restore-keys: go-mod-

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      web/pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Build frontend
              run: |
                  pnpm --dir web install --frozen-lockfile
                  pnpm --dir web run build
                  pnpm --dir frontend install --frozen-lockfile
                  pnpm --dir frontend run build

            - name: Generate Windows resources
              run: |
                  go install github.com/tc-hib/go-winres@latest
                  export PATH="$(go env GOPATH)/bin:$PATH"
                  VERSION=${GITHUB_REF_NAME#v}
                  mkdir -p winres
                  cat > winres/winres.json << EOFJ
                  {
                    "RT_GROUP_ICON": {
                      "APP": {
                        "0000": "icon.ico"
                      }
                    },
                    "RT_MANIFEST": {
                      "#1": {
                        "0000": "wails.exe.manifest"
                      }
                    }
                  }
                  EOFJ
                  cp build/windows/icon.ico winres/icon.ico
                  cp build/windows/wails.exe.manifest winres/wails.exe.manifest
                  go-winres make --product-version "$VERSION" --file-version "$VERSION" --arch amd64

            - name: Build Windows amd64
              env:
                  CGO_ENABLED: '1'
                  GOOS: windows
                  GOARCH: amd64
                  CC: x86_64-w64-mingw32-gcc
                  CXX: x86_64-w64-mingw32-g++
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  go build -trimpath -tags "desktop production" -ldflags "-s -w -H windowsgui -X github.com/sjzar/chatlog/pkg/version.Version=${VERSION}" -o dist/chatlog.exe .

            - name: Compress with UPX
              run: upx --best --lzma dist/chatlog.exe || true

            - name: Package
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  cd dist && zip -j ../chatlog_${VERSION}_windows_amd64.zip chatlog.exe

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: chatlog-windows-amd64
                  path: chatlog_*.zip

    build-macos:
        name: Build macOS (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: macos-13
                      goarch: amd64
                    - arch: arm64
                      runner: macos-latest
                      goarch: arm64
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      web/pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Build frontend
              run: |
                  pnpm --dir web install --frozen-lockfile
                  pnpm --dir web run build
                  pnpm --dir frontend install --frozen-lockfile
                  pnpm --dir frontend run build

            - name: Build
              env:
                  CGO_ENABLED: '1'
                  GOOS: darwin
                  GOARCH: ${{ matrix.goarch }}
                  CGO_LDFLAGS: '-framework UniformTypeIdentifiers'
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  go build -trimpath -tags "desktop production" -ldflags "-s -w -X github.com/sjzar/chatlog/pkg/version.Version=${VERSION}" -o dist/chatlog .

            - name: Package
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  cd dist && zip -j ../chatlog_${VERSION}_darwin_${{ matrix.arch }}.zip chatlog

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: darwin-${{ matrix.arch }}
                  path: chatlog_*.zip

    release:
        name: Create Release
        needs: [build-windows, build-macos]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true

            - name: Generate checksums
              run: sha256sum chatlog_*.zip > checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  generate_release_notes: true
                  files: |
                      chatlog_*.zip
                      checksums.txt
