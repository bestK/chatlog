# GoReleaser v2 配置
version: 2

before:
    hooks:
        - go mod tidy
        - sh -c "pnpm --dir web install --frozen-lockfile && pnpm --dir web run build && pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend run build"

builds:
    - id: chatlog-windows
      binary: chatlog
      ldflags:
          - -s -w -X github.com/sjzar/chatlog/pkg/version.Version={{.Version}}
      tags:
          - desktop
          - production
      env:
          - CGO_ENABLED=1
      goos:
          - windows
      goarch:
          - amd64
          - arm64
      overrides:
          - goos: windows
            goarch: amd64
            env:
                - CGO_ENABLED=1
                - CC=x86_64-w64-mingw32-gcc
                - CXX=x86_64-w64-mingw32-g++
          - goos: windows
            goarch: arm64
            env:
                - CGO_ENABLED=1
                - CC=aarch64-w64-mingw32-gcc
                - CXX=aarch64-w64-mingw32-g++

    - id: chatlog-darwin
      binary: chatlog
      ldflags:
          - -s -w -X github.com/sjzar/chatlog/pkg/version.Version={{.Version}}
      tags:
          - desktop
          - production
      env:
          - CGO_ENABLED=1
      goos:
          - darwin
      goarch:
          - amd64
          - arm64
      overrides:
          - goos: darwin
            goarch: amd64
            env:
                - CGO_ENABLED=1
                - CC=o64-clang
                - CXX=o64-clang++
          - goos: darwin
            goarch: arm64
            env:
                - CGO_ENABLED=1
                - CC=oa64-clang
                - CXX=oa64-clang++

upx:
    - enabled: true
      goos: [windows]
      goarch: [amd64, arm64]
      compress: best
      lzma: true

archives:
    - id: default
      formats: zip
      name_template: >-
          {{ .ProjectName }}_
          {{- .Version }}_
          {{- .Os }}_
          {{- .Arch }}
      files:
          - LICENSE
          - README.md

checksum:
    name_template: 'checksums.txt'
    algorithm: sha256

# 配置 GitHub Release
release:
    draft: true
    prerelease: auto
    mode: replace
